@if (isInitialized) {
  <oe-flat-widget [title]="component.alias" button link="/device/{{ edge.id }}/history/{{ componentId }}/thresholdpeakshavingchart" [icon]="{ name: 'trending-down-outline', color: 'normal', size: 'large' }">
    <oe-flat-widget-line [name]="'EDGE.INDEX.WIDGETS.PEAKSHAVING.PEAKSHAVING_ENERGY' | translate"
      [channelAddress]="component.id + '/PeakShavingEnergy'" [converter]="Converter.WATT_HOURS_IN_KILO_WATT_HOURS">
    </oe-flat-widget-line>
    <oe-flat-widget-line [name]="'EDGE.INDEX.WIDGETS.PEAKSHAVING.RECHARGED_ENERGY' | translate"
      [channelAddress]="component.id + '/RechargedEnergy'" [converter]="Converter.WATT_HOURS_IN_KILO_WATT_HOURS">
    </oe-flat-widget-line>
  </oe-flat-widget>
}
